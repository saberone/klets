name: Build & Publish klets-audio

on:
  push:
    tags:
      - 'audio-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            package: audio-darwin-arm64
            binary: klets-audio
          - target: x86_64-apple-darwin
            os: macos-14
            package: audio-darwin-x64
            binary: klets-audio
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            package: audio-linux-x64-gnu
            binary: klets-audio
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            package: audio-linux-arm64-gnu
            binary: klets-audio
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            package: audio-win32-x64
            binary: klets-audio.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            package: audio-win32-arm64
            binary: klets-audio.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Linux cross-compilation tools
        if: matrix.cross
        run: |
          sudo dpkg --add-architecture arm64
          # Pin existing sources to amd64 — they don't carry arm64
          sudo sed -i '/^Types: deb$/i Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          # Add ports.ubuntu.com for arm64
          cat <<'EOF' | sudo tee /etc/apt/sources.list.d/arm64-ports.sources
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-security
          Components: main restricted universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libasound2-dev:arm64

      - name: Install Linux ALSA dev (native)
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Build
        working-directory: crates/klets-audio
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.cross && '1' || '' }}
          PKG_CONFIG_PATH: ${{ matrix.cross && '/usr/lib/aarch64-linux-gnu/pkgconfig' || '' }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Copy binary to package
        shell: bash
        run: |
          cp crates/klets-audio/target/${{ matrix.target }}/release/${{ matrix.binary }} \
             packages/${{ matrix.package }}/bin/${{ matrix.binary }}
          chmod +x packages/${{ matrix.package }}/bin/${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.package }}
          path: packages/${{ matrix.package }}/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: packages/

      - name: Fix binary permissions (lost in artifact upload)
        run: |
          chmod +x packages/audio-*/bin/klets-audio || true
          chmod +x packages/audio-*/bin/klets-audio.exe || true

      - name: Publish platform packages
        run: |
          for pkg in packages/audio-*/; do
            echo "Publishing $(basename $pkg)..."
            cd "$pkg"
            npm publish --provenance --access public
            cd -
          done
